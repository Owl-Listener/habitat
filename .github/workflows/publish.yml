name: Publish to npm

# Runs when you publish a release on GitHub (Releases → Draft a new release).
# Tag the release with the version in package.json, e.g. v0.3.0.
#
# It uses npm's trusted publishing, so no npm token is stored anywhere:
# npm checks that the release came from this workflow in this repository
# (set up on npmjs.com under the package's Settings → Trusted publishing).
#
# Releases are staged, not published: the new version waits under
# Staged Packages on npmjs.com until a maintainer approves it there, behind
# two-factor login. So nothing reaches people who install habitat without a
# person saying yes, even if this repository were ever compromised.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify the package was built here (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: The release tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "The release tag is ${GITHUB_REF_NAME} but package.json says $version"
            exit 1
          fi

      - run: npm run validate
      - run: npm test

      - name: Stage the release on npm (approve it on npmjs.com to publish)
        run: npm stage publish

name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: The worked example is complete and valid
        run: npm run validate

      - name: Freshly scaffolded templates are valid drafts
        run: |
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/bin/habitat.js" init
          # _TEMPLATE.md is skipped by design, so check a copy of it too.
          cp design/components/_TEMPLATE.md design/components/example.md
          node "$GITHUB_WORKSPACE/bin/habitat.js" validate design

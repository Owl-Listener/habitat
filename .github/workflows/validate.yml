name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: The worked example is complete and valid
        run: npm run validate

      - name: The example code passes its own design system's checks
        run: npm run check

      - name: Tests (init, validate, check, parity, MCP server)
        run: npm test
